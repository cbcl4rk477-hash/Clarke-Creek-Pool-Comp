<body>
<div id="app"><div style="text-align:center;padding:80px 20px;color:rgba(242,234,216,0.4);font-size:14px;letter-spacing:2px;">LOADING…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ─── SUPABASE CONFIG ─────────────────────────────────────────────────────
// supabase.com → your project → Settings → API
const SUPABASE_URL  = "https://agzvujlisrhqkehtfltw.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnenZ1amxpc3JocWtlaHRmbHR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NzQyODEsImV4cCI6MjA5NDQ1MDI4MX0.TWN6MNPDFl942XGkt1yccOUm1oD6KSNZ9ZiNlTD2Vec";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const DB_KEY = "cc_pool_v3";

// ─── DATA ───────────────────────────────────────────────────────────────
const PLAYERS = [
  {id:0, name:"Alex Rickard",    short:"AR", roster:"1on1off_wed"},
  {id:1, name:"Luke Edwards",    short:"LE", roster:"1on1off_wed"},
  {id:2, name:"Luke Boardman",   short:"LB", roster:"1on1off_wed"},
  {id:3, name:"Murray Cavanagh", short:"MC", roster:"1on1off_wed"},
  {id:4, name:"Simon Moroney",   short:"SM", roster:"1on1off_wed"},
  {id:5, name:"Christian Clark", short:"CC", roster:"1on1off_wed"},
  {id:6, name:"Ivor Ralph",      short:"IR", roster:"2on2off"},
  {id:7, name:"John Rowe",       short:"JR", roster:"2on2off"},
  {id:8, name:"Alex Mitchell",   short:"AM", roster:"2on1off"},
  {id:9, name:"Dan Moor",        short:"DM", roster:"2on1off"},
  {id:10,name:"Cameron Ellis",   short:"CE", roster:"2on2off"},
  {id:11,name:"Jackson Geddes",  short:"JG", roster:"2on2off"},
  {id:12,name:"Kym Gray",        short:"KG", roster:"2on2off"},
  {id:13,name:"Bryce Brown",     short:"BB", roster:"2on2off"},
  {id:14,name:"Degen Runge",     short:"DR", roster:"1on1off_mon"},
];

const AV_COLORS = ["#c0392b","#2980b9","#27ae60","#8e44ad","#e67e22","#16a085","#d35400","#1abc9c","#f39c12","#6c5ce7","#e84393","#00b894","#e17055","#0984e3","#b8860b"];
const ROSTER_LABELS = {"1on1off_wed":"1on/1off (Wed)","1on1off_mon":"1on/1off (Mon)","2on2off":"2on/2off","2on1off":"2on/1off"};
const MS_DAY = 86400000;
const PRIZE_PER_GAME = 5;

// ─── STATE ──────────────────────────────────────────────────────────────
let state = {
  tab: "setup",
  compStart: new Date().toISOString().split("T")[0],
  playerStarts: Object.fromEntries(PLAYERS.map(p=>[p.id,""])),
  ptW:3, ptD:1, ptL:0,
  groups: null,
  fixtures: [],
  knockout: initKnockout(),
  activeGroup: "A",
  groupView: "fixtures",
  filterPlayer: "all",
  showPlayed: true,
  saveMsg: ""
};

function initKnockout() {
  return [
    {id:"sf1",  label:"Semi-Final 1",      desc:"Group A 1st vs Group B 2nd", result:null},
    {id:"sf2",  label:"Semi-Final 2",      desc:"Group B 1st vs Group A 2nd", result:null},
    {id:"sf3",  label:"3rd Place Semi",    desc:"Group A 3rd vs Group B 3rd", result:null},
    {id:"final",label:"🏆 Grand Final",    desc:"SF1 winner vs SF2 winner",   result:null},
    {id:"third",label:"3rd Place Play-off",desc:"SF3 winner vs SF1 loser",    result:null},
  ];
}

// ─── SUPABASE STORAGE ────────────────────────────────────────────────────
let saveTimer = null;

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 700);
}

async function saveState() {
  try {
    const { error } = await sb.from("pool_state").upsert({
      key:          DB_KEY,
      compStart:    state.compStart,
      playerStarts: state.playerStarts,
      ptW:          state.ptW,
      ptD:          state.ptD,
      ptL:          state.ptL,
      groups:       state.groups,
      fixtures:     state.fixtures,
      knockout:     state.knockout,
      updated_at:   new Date().toISOString()
    }, { onConflict: "key" });
    state.saveMsg = error ? "⚠ Save failed" : "✓ Saved";
  } catch(e) {
    state.saveMsg = "⚠ Save failed";
  }
  render();
  setTimeout(() => { state.saveMsg = ""; render(); }, 2500);
}

async function loadState() {
  try {
    const { data, error } = await sb.from("pool_state").select("*").eq("key", DB_KEY).single();
    if (error || !data) return;
    if (data.compStart)                              state.compStart    = data.compStart;
    if (data.playerStarts)                           state.playerStarts = data.playerStarts;
    if (data.ptW !== undefined && data.ptW !== null) state.ptW = data.ptW;
    if (data.ptD !== undefined && data.ptD !== null) state.ptD = data.ptD;
    if (data.ptL !== undefined && data.ptL !== null) state.ptL = data.ptL;
    if (data.groups)                                 state.groups   = data.groups;
    if (data.fixtures && data.fixtures.length)       { state.fixtures = data.fixtures; state.tab = "groups"; }
    if (data.knockout && data.knockout.length)       state.knockout = data.knockout;
  } catch(e) { /* silent — app still renders with default state */ }
}

// ─── ROSTER LOGIC ────────────────────────────────────────────────────────
function cycleLenDays(roster) {
  if (roster==="1on1off_wed"||roster==="1on1off_mon") return 14;
  if (roster==="2on2off") return 28;
  if (roster==="2on1off") return 21;
  return 14;
}
function onDaysInCycle(roster) {
  if (roster==="1on1off_wed"||roster==="1on1off_mon") return 7;
  if (roster==="2on2off") return 14;
  if (roster==="2on1off") return 14;
  return 7;
}
function isOnSite(player, date) {
  const startStr = state.playerStarts[player.id];
  if (startStr) {
    const start = new Date(startStr+"T00:00:00");
    if (date < start) return false;
    const daysSince = Math.floor((date-start)/MS_DAY);
    return (daysSince % cycleLenDays(player.roster)) < onDaysInCycle(player.roster);
  }
  const ref = new Date("2020-01-01T00:00:00");
  const daysSince = Math.floor((date-ref)/MS_DAY);
  const c = cycleLenDays(player.roster), o = onDaysInCycle(player.roster);
  return ((daysSince%c)+c)%c < o;
}
function weekKey(player, date) {
  const d = new Date(date), day = d.getDay();
  const pivot = player.roster==="1on1off_wed" ? 3 : 1;
  const daysBack = (day+7-pivot)%7;
  const ws = new Date(d.getTime()-daysBack*MS_DAY).toISOString().split("T")[0];
  return player.id+":"+ws;
}
function ds(date) { return date.toISOString().split("T")[0]; }
function pd(s) { return new Date(s+"T00:00:00"); }
function fmtDate(d) { return d.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"}); }
function fmtShort(d) { return d.toLocaleDateString("en-AU",{day:"numeric",month:"short"}); }

// ─── FIXTURE GENERATION ──────────────────────────────────────────────────
function buildGroupFixtures(groupPlayers, gLabel) {
  if (!state.compStart) return [];
  const start = pd(state.compStart);
  const pairs = [];
  for (let i=0;i<groupPlayers.length;i++)
    for (let j=i+1;j<groupPlayers.length;j++)
      pairs.push([groupPlayers[i],groupPlayers[j]]);
  for (let i=pairs.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [pairs[i],pairs[j]]=[pairs[j],pairs[i]];
  }
  const MAX_DAYS=700, MAX_PER_DAY=3, GPW=1;
  const dayLoad={}, weekLoad={};
  const fixtures=[];
  let fid=0;
  for (const [p1,p2] of pairs) {
    let done=false;
    for (let d=0;d<MAX_DAYS&&!done;d++) {
      const date=new Date(start.getTime()+d*MS_DAY);
      const dateStr=ds(date);
      if (!isOnSite(p1,date)||!isOnSite(p2,date)) continue;
      if ((dayLoad[dateStr]||0)>=MAX_PER_DAY) continue;
      const wk1=weekKey(p1,date), wk2=weekKey(p2,date);
      if ((weekLoad[wk1]||0)>=GPW||(weekLoad[wk2]||0)>=GPW) continue;
      dayLoad[dateStr]=(dayLoad[dateStr]||0)+1;
      weekLoad[wk1]=(weekLoad[wk1]||0)+1;
      weekLoad[wk2]=(weekLoad[wk2]||0)+1;
      fixtures.push({id:gLabel+"-"+fid++,p1:p1.id,p2:p2.id,date:dateStr,result:null,group:gLabel});
      done=true;
    }
    if (!done) {
      for (let d=0;d<MAX_DAYS;d++) {
        const date=new Date(start.getTime()+d*MS_DAY);
        const dateStr=ds(date);
        if (isOnSite(p1,date)&&isOnSite(p2,date)) {
          fixtures.push({id:gLabel+"-"+fid++,p1:p1.id,p2:p2.id,date:dateStr,result:null,group:gLabel,fallback:true});
          break;
        }
      }
    }
  }
  return fixtures.sort((a,b)=>a.date.localeCompare(b.date));
}

function seededShuffle(arr, seed) {
  const a=[...arr]; let s=seed;
  for (let i=a.length-1;i>0;i--) {
    s=(s*1664525+1013904223)&0xffffffff;
    const j=Math.abs(s)%(i+1);
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function drawAndGenerate() {
  const seed=Date.now();
  const shuffled=seededShuffle(PLAYERS,seed);
  state.groups={A:shuffled.slice(0,8), B:shuffled.slice(8,15)};
  const fA=buildGroupFixtures(state.groups.A,"A");
  const fB=buildGroupFixtures(state.groups.B,"B");
  state.fixtures=[...fA,...fB];
  state.knockout=initKnockout();
  state.tab="groups";
  scheduleSave();
  render();
}

// ─── STANDINGS ───────────────────────────────────────────────────────────
function calcStandings(players, groupLabel) {
  const stats=players.map(p=>({p,pl:0,w:0,d:0,l:0,pts:0}));
  const gFix=state.fixtures.filter(f=>f.group===groupLabel);
  for (const f of gFix) {
    if (!f.result) continue;
    const s1=stats.find(s=>s.p.id===f.p1), s2=stats.find(s=>s.p.id===f.p2);
    if (!s1||!s2) continue;
    s1.pl++;s2.pl++;
    if (f.result==="p1"){s1.w++;s1.pts+=state.ptW;s2.l++;s2.pts+=state.ptL;}
    else if (f.result==="p2"){s2.w++;s2.pts+=state.ptW;s1.l++;s1.pts+=state.ptL;}
    else{s1.d++;s1.pts+=state.ptD;s2.d++;s2.pts+=state.ptD;}
  }
  return stats.sort((a,b)=>b.pts-a.pts||b.w-a.w||a.l-b.l);
}

// ─── AVATAR ──────────────────────────────────────────────────────────────
function av(pid, size=26) {
  const p=PLAYERS.find(x=>x.id===pid);
  if (!p) return `<span style="width:${size}px;height:${size}px;border-radius:50%;background:rgba(255,255,255,0.1);display:inline-block;"></span>`;
  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.floor(size*0.35)}px;background:${AV_COLORS[p.id%AV_COLORS.length]};">${p.short}</span>`;
}
function pName(pid) { return PLAYERS.find(p=>p.id===pid)?.name||"?"; }
function pFirst(pid) { return pName(pid).split(" ")[0]; }
function pColor(pid) { return AV_COLORS[pid%AV_COLORS.length]; }

// ─── RENDER KNOCKOUT ─────────────────────────────────────────────────────
function renderKnockout() {
  if (!state.groups) return '<div class="empty">Generate fixtures from Setup first.</div>';
  const standA=calcStandings(state.groups.A,"A");
  const standB=calcStandings(state.groups.B,"B");
  const A1=standA[0]?.p,A2=standA[1]?.p,A3=standA[2]?.p;
  const B1=standB[0]?.p,B2=standB[1]?.p,B3=standB[2]?.p;

  const seeded={
    sf1:{p1:A1?.id??null,p2:B2?.id??null},
    sf2:{p1:B1?.id??null,p2:A2?.id??null},
    sf3:{p1:A3?.id??null,p2:B3?.id??null},
  };

  function getResult(mid) { return state.knockout.find(m=>m.id===mid)?.result||null; }
  function winnerId(mid,s) { const r=getResult(mid); if(!r)return null; return r==="p1"?s?.p1:r==="p2"?s?.p2:null; }
  function loserId(mid,s)  { const r=getResult(mid); if(!r)return null; return r==="p1"?s?.p2:r==="p2"?s?.p1:null; }

  const finalP1=winnerId("sf1",seeded.sf1), finalP2=winnerId("sf2",seeded.sf2);
  const thirdP1=winnerId("sf3",seeded.sf3), thirdP2=loserId("sf1",seeded.sf1);
  const champion=winnerId("final",{p1:finalP1,p2:finalP2});

  function koMatch(mid, p1id, p2id, label, desc, disabled=false, isFinal=false) {
    const p1=p1id!=null?PLAYERS.find(p=>p.id===p1id):null;
    const p2=p2id!=null?PLAYERS.find(p=>p.id===p2id):null;
    const r=getResult(mid);
    const controls=(!disabled&&p1&&p2)?`
      <div style="display:flex;align-items:center;gap:7px;">
        <select onchange="setKOResult('${mid}',this.value)">
          <option value="">— Result —</option>
          <option value="p1" ${r==='p1'?'selected':''}>${p1.name.split(" ")[0]} wins</option>
          <option value="p2" ${r==='p2'?'selected':''}>${p2.name.split(" ")[0]} wins</option>
        </select>
        ${r?`<span class="badge badge-done">✓</span>`:''}
      </div>`:`<span style="font-size:11px;color:rgba(242,234,216,0.4);font-style:italic;">Awaiting results</span>`;
    return `<div class="ko-match${isFinal?' final':''}">
      <div class="ko-label">${label}</div>
      <div class="ko-desc">${desc}</div>
      <div class="ko-row">
        <div class="ko-players">
          ${p1?`${av(p1.id,26)}<span class="fix-p" style="color:${pColor(p1.id)};">${p1.name}</span>`:`<span class="tbd">TBD</span>`}
          <span class="fix-vs">vs</span>
          ${p2?`${av(p2.id,26)}<span class="fix-p" style="color:${pColor(p2.id)};">${p2.name}</span>`:`<span class="tbd">TBD</span>`}
        </div>
        ${controls}
      </div>
    </div>`;
  }

  const championBanner = champion ? `
    <div class="champion-banner">
      <div style="font-size:48px;">🏆</div>
      <div style="font-size:22px;font-weight:800;color:#c9a84c;margin-top:8px;">${pName(champion)}</div>
      <div style="font-size:13px;color:rgba(242,234,216,0.4);margin-top:4px;">Clarke Creek Pool Champion!</div>
    </div>` : '';

  const qualifyHtml = `
    <div class="card">
      <div class="card-title">Qualified Players</div>
      <div class="qualify-grid">
        ${["A","B"].map(g=>{
          const stand=g==="A"?standA:standB;
          return `<div>
            <div class="qualify-group-title">Group ${g} — Top 3</div>
            ${stand.slice(0,3).map((s,i)=>`
              <div class="qualify-row">
                <span style="font-size:14px;width:20px;text-align:center;">${["🥇","🥈","✅"][i]}</span>
                ${av(s.p.id,22)}<span style="font-size:13px;font-weight:500;">${s.p.name}</span>
                <span class="qualify-pts">${s.pts}pts</span>
              </div>`).join('')}
          </div>`;
        }).join('')}
      </div>
    </div>`;

  return `
    ${championBanner}
    ${!A1||!B1?`<div class="info">ℹ️ Complete the group stage to seed the knockout bracket.</div>`:''}
    <div class="card">
      <div class="card-title">Semi-Finals</div>
      ${koMatch("sf1",seeded.sf1.p1,seeded.sf1.p2,"Semi-Final 1","Group A 1st vs Group B 2nd")}
      ${koMatch("sf2",seeded.sf2.p1,seeded.sf2.p2,"Semi-Final 2","Group B 1st vs Group A 2nd")}
      ${koMatch("sf3",seeded.sf3.p1,seeded.sf3.p2,"3rd Place Semi","Group A 3rd vs Group B 3rd")}
    </div>
    <div class="card">
      <div class="card-title">Finals</div>
      ${koMatch("final",finalP1,finalP2,"🏆 Grand Final","SF1 winner vs SF2 winner",!finalP1||!finalP2,true)}
      ${koMatch("third",thirdP1,thirdP2,"3rd Place Play-off","SF3 winner vs SF1 loser",!thirdP1||!thirdP2)}
    </div>
    ${qualifyHtml}`;
}

    </div>
    <div class="card">
      <div class="card-title">Game by Game — $${PRIZE_PER_GAME} per game</div>
      <div class="game-grid">${gameCells}${totalMatches>60?`<span style="font-size:11px;color:rgba(242,234,216,0.4);align-self:center;margin-left:4px;">+${totalMatches-60} more</span>`:''}</div>
    </div>`;
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────
function render() {
  const totalPot=(state.fixtures.filter(f=>f.result).length+state.knockout.filter(m=>m.result).length)*PRIZE_PER_GAME;
  const tabs=[{id:"setup",label:"⚙️ Setup"},{id:"groups",label:"🎱 Groups"},{id:"knockout",label:"⚔️ Knockout"},{id:"prize",label:"💰 Prize"}];
  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="balls">
        ${[["1","#f4d03f","#333"],["2","#2980b9","#fff"],["3","#e74c3c","#fff"],["8","#111","#fff"],["4","#8e44ad","#fff"],["5","#e67e22","#fff"]].map(([n,bg,c])=>`<div class="ball" style="background:${bg};color:${c};">${n}</div>`).join('')}
      </div>
      <h1>Clarke Creek<br>Pool Competition</h1>
      <p class="subtitle">Group Stage · Top 3 Qualify · Knockout Finals</p>
      ${totalPot>0?`<div class="pot-badge"><strong>$${totalPot}</strong> prize pool</div>`:''}
      ${state.saveMsg?`<div class="save-msg">${state.saveMsg}</div>`:''}
    </div>
    <div class="format-grid">
      <div class="format-box"><strong>15 Players</strong><span>2 groups</span></div>
      <div class="format-box"><strong>Top 3 Qualify</strong><span>per group</span></div>
      <div class="format-box"><strong>$5 / game</strong><span>prize pool</span></div>
    </div>
    <div class="tabs">
      ${tabs.map(t=>`<button class="tab-btn${state.tab===t.id?' active':''}" onclick="state.tab='${t.id}';render();">${t.label}</button>`).join('')}
    </div>
    <div id="panel-content">
      ${state.tab==='setup'?renderSetup():state.tab==='groups'?renderGroups():state.tab==='knockout'?renderKnockout():renderPrize()}
    </div>
    <div style="text-align:center;padding-bottom:24px;margin-top:6px;">
      <span style="font-size:11px;color:rgba(242,234,216,0.15);letter-spacing:2px;">CLARKE CREEK · 🎱 · $5 PER GAME</span>
    </div>`;
}

// ─── EVENT HANDLERS ──────────────────────────────────────────────────────
function setResult(fid, val) {
  const f = state.fixtures.find(x=>x.id===fid);
  if (f) { f.result = val||null; scheduleSave(); render(); }
}
function setKOResult(mid, val) {
  const m = state.knockout.find(x=>x.id===mid);
  if (m) { m.result = val||null; scheduleSave(); render(); }
}

// ─── INIT ────────────────────────────────────────────────────────────────
loadState().then(() => render());
</script>
</body>
</html>
